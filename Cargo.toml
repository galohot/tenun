[workspace]
resolver = "3"
members = ["crates/tenun-core", "crates/tenun", "app/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/galohot/tenun"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
duckdb = { version = "1.10506", features = ["bundled"] }
calamine = { version = "0.36", features = ["dates"] }
notify = "8"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# DuckDB is several million lines of C++. With full debug info its debug build
# fills a CI runner's disk, so dependencies build without it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
