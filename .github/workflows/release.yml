name: Release

# Push a tag like v0.1.0. Builds the desktop app for Windows, macOS and Linux
# and the `tenun` command-line binary, and attaches them to a draft release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # The version's part of the CHANGELOG: the release notes, and what the app's update bar shows.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<NOTES_END'
            awk -v h="## $v " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md
            echo
            echo 'Install notes are in the README. Code signing policy: https://github.com/galohot/tenun#code-signing-policy'
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      # The update key signs what the app's updater downloads (0.7 build 01); latest.json lists it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Tenun ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      # The Windows installers go to the signing job when SignPath is set up (code signing policy in the README).
      - name: Windows installers to sign
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  cli:
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo build --release -p tenun --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=tenun-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/tenun.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp target/${{ matrix.target }}/release/tenun "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

  # Signs the Windows installers with the SignPath Foundation certificate, then puts the signed files on the release in
  # place of the unsigned ones. Runs only once the repository has the SIGNPATH_* variables and the SIGNPATH_API_TOKEN
  # secret; until then the release keeps its unsigned installers. Each signing request waits for an approver.
  sign:
    needs: app
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: unsigned
      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-to-sign
          path: unsigned
          if-no-files-found: error
      - name: Version
        id: version
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tenun' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'windows-installers' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.v }}"
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed
      # SignPath changed the bytes, so the update signatures of the unsigned files no longer match (AD-D5): sign the
      # signed files again with the update key and put the new signatures in latest.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update signatures of the signed installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in signed/msi/*.msi signed/nsis/*-setup.exe; do
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern latest.json
          python3 - <<'PY'
          import glob, json, os
          m = json.load(open('latest.json'))
          sigs = {os.path.basename(f[:-4]): open(f).read().strip() for f in glob.glob('signed/*/*.sig')}
          for p in m['platforms'].values():
              name = p['url'].rsplit('/', 1)[-1]
              if name in sigs:
                  p['signature'] = sigs[name]
          json.dump(m, open('latest.json', 'w'), indent=2)
          PY
      - name: Signed installers on the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" signed/msi/*.msi signed/msi/*.msi.sig signed/nsis/*-setup.exe signed/nsis/*-setup.exe.sig latest.json --clobber --repo "${{ github.repository }}"

  checksums:
    needs: [app, cli, sign]
    # After the signed installers are in, or without signing when it is not set up.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: SHA-256 of every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl && cd dl
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
